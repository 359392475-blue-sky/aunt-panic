name: Feature request
description: Suggest a feature or safety improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What media-literacy or product problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: How should the feature avoid unmarked misinformation, harassment, or high-risk content?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
