[project]
name = "aunt-panic-backend"
version = "0.1.0"
description = "二舅妈急了 - 后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pillow>=11.0",
    "openai>=1.55",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.12",
    "playwright>=1.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["路由", "模块", "服务", "配置"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
